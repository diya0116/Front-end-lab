    <style>
        /* Basic styling for the whole page */
        body {
            margin: 0;
            font-family: "Montserrat", sans-serif;
            background-color: #f5f5f5;
            color: #222222;
        }


        /* Navigation Bar */
        header {
            background-color: #4b2e2e;
            padding: 15px;
        }

        nav {
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 16px;
        }

        nav a:hover {
            text-decoration: underline;
        }


        /* Main Homepage Section */
        main {
            padding: 0;
            background: #e8d8c3;
        }

        .hero {
            text-align: center;
            padding: 60px 20px;
        }

        .hero h1 {
            font-size: 56px;
            color: #4b2e2e;
            margin-bottom: 10px;
            font-family: "Cherry Cream Soda", cursive;
        }

        .hero h2 {
            color: #6b4b4b;
            margin-bottom: 20px;
        }

        .hero p {
            max-width: 700px;
            margin: 0 auto 25px;
        }

        .video-box {
            width: 80%;
            max-width: 900px;
            margin: 40px auto 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        .video-box video {
            width: 100%;
            display: block;
        }

        .register-button {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 25px;
            background-color: #4b2e2e;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .register-button:hover {
            background-color: #2f1b1b;
        }

        /* Footer */
        footer {
            background-color: #4b2e2e;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
